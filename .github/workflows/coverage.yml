name: C++ and Python coverage

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  PIXI_FROZEN: "true"

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          # Use the runner's default g++/gcov pair (g++-13 on ubuntu-24.04):
          # they are version-matched by construction, which lcov requires for
          # complete coverage data. (A previously hardcoded g++-11 broke when
          # scipp started using C++23 std::views::zip, which needs GCC >= 13.)
          sudo apt install --yes lcov

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # history required so cmake can determine version

      - name: ccache  # serves the coverage cmake build; see pr_and_main.yml
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: coverage
          max-size: 1G

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.0
          environments: dev test
          frozen: true
          cache: true

      - name: C++ coverage
        run: |
          mkdir coverage_html
          # The dev env ships conda cxx-compiler whose activation exports CXX;
          # override it so the build uses system g++ with a matching system gcov.
          pixi run -e dev -- cmake --preset coverage -DCMAKE_CXX_COMPILER=/usr/bin/g++
          pixi run -e dev -- cmake --build --preset coverage
          mv build/coverage coverage_html/cpp

      - name: Python coverage
        run: |
          pixi run -e test coverage
          rm -f coverage_html/python/.gitignore

      - name: Setup HTML
        run: mv tools/scipp-coverage-index.html coverage_html/index.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          repository-name: scipp/scipp-coverage
          branch: main
          folder: coverage_html
          single-commit: true
          ssh-key: ${{ secrets.COVERAGE_DEPLOY_KEY }}
