name: Conda build

on:
  workflow_call:
    inputs:
      os:
        description: "Operating system, e.g., ubuntu-24.04, macos-15-intel, or windows-2022"
        required: true
        type: string
      target:
        description: "Conda target: linux_64, osx_64, osx_arm64, or win_64"
        required: true
        type: string
      python-version:
        description: "Python version such as 3.11"
        required: true
        type: string

defaults:
  run:
    shell: bash

env:
  PIXI_FROZEN: "true"

# This workflow tests the conda packaging code path (conda/recipe.yaml, which
# mirrors the conda-forge feedstock recipe) with rattler-build via pixi. Real
# conda releases are made by https://github.com/conda-forge/scipp-feedstock.
jobs:
  build_conda:
    name: Package build (${{ inputs.target }}, py${{ inputs.python-version }})
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # history required to determine version from git tags

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.0
          environments: package
          frozen: true
          cache: true

      - name: Create variant file for conda build
        run: |
          echo "python:" > dynamic_var.yaml
          if [[ "${{ inputs.python-version }}" == "3.14t" ]]; then
            # Explicit cp314t build string selects the free-threaded python;
            # rattler-build requires variant values to be lists.
            echo "- 3.14.* *_cp314t" >> dynamic_var.yaml
            echo "is_freethreading:" >> dynamic_var.yaml
            echo "- true" >> dynamic_var.yaml
          elif [[ "${{ inputs.python-version }}" == "3.13" || "${{ inputs.python-version }}" == "3.14" ]]; then
            echo "- ${{ inputs.python-version }}.* *_cp$(echo ${{ inputs.python-version }} | tr -d '.')" >> dynamic_var.yaml
          else
            echo "- ${{ inputs.python-version }}.* *_cpython" >> dynamic_var.yaml
          fi
          echo "numpy:" >> dynamic_var.yaml
          echo "- '2'" >> dynamic_var.yaml
          echo "python_impl:" >> dynamic_var.yaml
          echo "- cpython" >> dynamic_var.yaml
          echo "is_python_min:" >> dynamic_var.yaml
          echo "- false" >> dynamic_var.yaml
      - run: cat dynamic_var.yaml
      - run: pixi run -e package conda-package ${{ inputs.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: conda-package-${{ inputs.target }}-py${{ inputs.python-version }}
          path: conda/package/*/scipp*.conda
