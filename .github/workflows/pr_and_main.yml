name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true # cancel jobs from previous push

env:
  # setup-pixi's frozen option only covers its own install step; this makes
  # every `pixi run` in the job frozen as well (no re-solving, no lock writes).
  PIXI_FROZEN: "true"

jobs:
  formatting:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.0
          environments: lint
          frozen: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      # CI installs use `frozen: true` (no manifest<->lock consistency check),
      # so verify here that pixi.lock is up to date with pixi.toml.
      - run: pixi lock --check
      - run: pixi run -e lint static
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Apply automatic formatting

  build_and_test:
    needs: formatting
    name: build and test ${{ matrix.variant.os }}, py${{ matrix.python-version }}
    runs-on: ${{ matrix.variant.os }}
    strategy:
      fail-fast: false
      matrix:
        variant:
        - {os: ubuntu-24.04}
        - {os: macos-15}
        - {os: windows-2022}
        python-version: ["3.11"]

    env:
      # Wire ccache into every cmake build in this job, including the
      # pixi-build-cmake package build that happens during `setup-pixi`
      # (environment variables propagate into the backend's build). Empty on
      # Windows: ccache with the conda MSVC toolchain is unproven here.
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ contains(matrix.variant.os, 'windows') && '' || 'ccache' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # history required so cmake can determine version

      - uses: egor-tensin/vs-shell@v2 # MSVC dev environment for the dev env's Ninja C++ build.

      # ccache must be installed and its cache restored BEFORE setup-pixi:
      # installing the `test` environment triggers the pixi-build-cmake package
      # build, which is the most expensive compile in the job.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.variant.os }}
          # Two full builds (dev + pixi-build package) do not fit the 500M default.
          max-size: 1G

      # `dev` (manual cmake -> cpp-test) and `test` (pixi-build-cmake -> Python
      # tests) are needed on every platform; `docs`/`type-check` only run on
      # Ubuntu, so they are installed there only.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.0
          environments: ${{ contains(matrix.variant.os, 'ubuntu') && 'dev test import-minimal docs type-check' || 'dev test import-minimal' }}
          frozen: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      # C++ tests via the dev env (manual cmake; pixi-build-cmake does not build
      # the C++ test suite). Python tests via the test env (pixi-build-cmake).
      - run: pixi run -e dev cpp-test

      # In the minimal env (scipp + numpy only): catches accidental hard
      # imports of optional dependencies.
      - run: pixi run -e import-minimal import-minimal

      - run: pixi run -e test test

      - run: pixi run -e type-check mypy
        if: ${{ contains(matrix.variant.os, 'ubuntu') }}

      - run: pixi run -e docs docs
        if: ${{ contains(matrix.variant.os, 'ubuntu') }}

      - run: pixi run -e docs linkcheck
        # Linkcheck can be flaky. Avoid randomly breaking PR builds by running only on `main`
        if: ${{ contains(matrix.variant.os, 'ubuntu') && github.ref == 'refs/heads/main' }}

      - uses: actions/upload-artifact@v4
        if: ${{ contains(matrix.variant.os, 'ubuntu') }}
        with:
          name: DocumentationHTML
          path: html/
