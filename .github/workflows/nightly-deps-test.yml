name: Run tests against nightly dependencies

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  PIXI_FROZEN: "true"

jobs:
  build_and_test:
    name: build and test ${{ matrix.variant.os }}, py${{ matrix.python-version }}
    runs-on: ${{ matrix.variant.os }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { os: ubuntu-24.04 }
          - { os: macos-15 }
          - { os: windows-2022 }
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0 # history required so cmake can determine version

      - uses: egor-tensin/vs-shell@v2  # MSVC dev environment for the dev env's Ninja C++ build.

      - name: ccache  # serves the dev env build; see pr_and_main.yml
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.variant.os }}
          max-size: 1G

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.0
          environments: dev test
          frozen: true
          cache: true

      - run: pixi run -e dev cpp-test

      - name: Install nightly dependencies and run tests
        # `python -m pip` guarantees the environment's interpreter; a bare
        # `pip` would fall through PATH to the runner's system pip and the
        # nightlies would never reach the test environment.
        run: |
          pixi run -e test python -m pip install --pre --index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple --extra-index-url https://pypi.org/simple numpy scipy h5py pandas xarray
          pixi run -e test python -c 'import numpy, scipy, h5py, pandas, xarray; print("numpy", numpy.__version__, "scipy", scipy.__version__, "h5py", h5py.__version__, "pandas", pandas.__version__, "xarray", xarray.__version__)'
          pixi run -e test test
