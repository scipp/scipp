name: Run tests against nightly dependencies

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  build_and_test:
    name: build and test ${{ matrix.variant.os }}, py${{ matrix.python-version }}
    runs-on: ${{ matrix.variant.os }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { os: ubuntu-24.04 }
          - { os: macos-15 }
          - { os: windows-2022 }
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0 # history required so cmake can determine version

      - uses: egor-tensin/vs-shell@v2  # MSVC dev environment for the dev env's Ninja C++ build.

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.0
          environments: dev test
          frozen: true
          cache: true

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.variant.os }}

      - run: pixi run -e dev cpp-test

      - name: Install nightly dependencies and run tests
        run: |
          pixi run -e test pip install --pre --index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple --extra-index-url https://pypi.org/simple numpy scipy h5py pandas xarray
          pixi run -e test test
